<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AllSet Rep Portal</title>

  <link rel="stylesheet" href="styles.css" />

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- Leaflet Draw -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css" />
</head>

<body>
  <!-- Nickname Gate -->
  <div id="gate" class="gate">
    <div class="gateCard">
      <div class="brand">
        <div class="logoDot"></div>
        <div>
          <div class="brandTitle">AllSet Rep Portal</div>
          <div class="brandSub">Enter your nickname to start.</div>
        </div>
      </div>

      <label for="nicknameInput">Nickname</label>
      <input id="nicknameInput" placeholder="Laith" maxlength="24" />

      <button id="enterBtn" type="button">Enter Map</button>
      <div class="gateHint">Local-only right now (we’ll make it live next).</div>
    </div>
  </div>

  <!-- App -->
  <div id="app" class="app app--locked">
    <div class="topbar">
      <div class="left">
        <span class="pill">Rep: <strong id="repName">—</strong></span>
        <span class="pill">Assigned: <strong id="assignedText">None</strong></span>
      </div>

      <div class="right">
        <button id="gpsBtn" class="ghostBtn" type="button">GPS: Off</button>
        <button id="addDotBtn" class="actionBtn" type="button">+ Add Dot</button>
        <button id="drawBtn" class="actionBtn" type="button">✏️ Draw</button>
        <button id="changeNameBtn" class="ghostBtn" type="button">Change Name</button>
        <button id="resetBtn" class="dangerBtn" type="button">Reset</button>
      </div>
    </div>

    <div id="map"></div>
    <div id="toast" class="toast hidden"></div>
  </div>

  <!-- IMPORTANT: JS order matters -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
