<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AllSet CRM</title>
</head>
<body>
  <script>
    (async () => {
      const source = "https://raw.githubusercontent.com/NotSlik/AllSet-Rep-Portal/43604be72dbeb524fc5165d04ebab38e1bda544f/index.html";
      const html = await fetch(source, { cache: "no-store" }).then(response => {
        if (!response.ok) throw new Error(`Could not load CRM shell: ${response.status}`);
        return response.text();
      });

      const parsed = new DOMParser().parseFromString(html.replace("app.js?v=inlineboot", "app.js?v=classic327"), "text/html");
      const scripts = [...parsed.scripts].map(oldScript => ({
        src: oldScript.getAttribute("src"),
        type: oldScript.getAttribute("type"),
        text: oldScript.textContent || ""
      }));

      document.head.innerHTML = parsed.head.innerHTML;
      document.body.innerHTML = parsed.body.innerHTML;
      document.querySelectorAll("script").forEach(script => script.remove());

      for (const item of scripts) {
        await new Promise((resolve, reject) => {
          const script = document.createElement("script");
          const isAppScript = item.src && item.src.includes("app.js");
          if (item.type && !isAppScript) script.type = item.type;
          if (item.src) {
            script.src = item.src;
            script.onload = resolve;
            script.onerror = () => reject(new Error(`Script failed: ${item.src}`));
          } else {
            script.textContent = item.text;
            resolve();
          }
          document.body.appendChild(script);
        });
      }
    })().catch(err => {
      console.error("CRM shell failed:", err);
      document.body.textContent = "CRM failed to load. Please refresh.";
    });
  </script>
</body>
</html>
