<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AllSet CRM</title>
</head>
<body>
  <script>
    (async () => {
      const source = "https://raw.githubusercontent.com/NotSlik/AllSet-Rep-Portal/43604be72dbeb524fc5165d04ebab38e1bda544f/index.html";
      const html = await fetch(source, { cache: "no-store" }).then(response => {
        if (!response.ok) throw new Error(`Could not load CRM shell: ${response.status}`);
        return response.text();
      });
      document.open();
      document.write(html.replace("app.js?v=inlineboot", "app.js?v=loader436"));
      document.close();
    })().catch(err => {
      console.error("CRM shell failed:", err);
      document.body.textContent = "CRM failed to load. Please refresh.";
    });
  </script>
</body>
</html>
